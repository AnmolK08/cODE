services:
  redis:
    image: redis:alpine
    container_name: redis02
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  mongo:
    image: mongo:7
    container_name: mongo02
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: mongo_redis02

volumes:
  redis_data:
  mongo_data: